# chain-alert config example
# Copy to config.yaml and fill in your own values (config.yaml is gitignored).

# --- 通知渠道（可同时配置多个，会并行推送）---
telegram:
  bot_token: "123456:ABC-DEF..."   # @BotFather 创建
  chat_id: "123456789"

discord:
  webhook_url: ""                  # 频道设置 -> 整合 -> Webhook -> 复制 URL

# --- 多链配置：每个链有自己的 RPC 和规则 ---
chains:
  - name: ethereum
    rpc_url: "https://ethereum-rpc.publicnode.com"
    ws_url: "wss://ethereum-rpc.publicnode.com"
    use_websocket: true
    explorer: "https://etherscan.io/tx/"
    confirmations: 0
    poll_interval_seconds: 12
    rules:
      - name: "ETH 巨鲸 > 500"
        type: native_transfer
        threshold_eth: 500
      - name: "USDT 巨鲸 > 100万"
        type: erc20_transfer
        token: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
        token_symbol: "USDT"
        decimals: 6
        threshold: 1000000

  - name: bsc
    rpc_url: "https://bsc-dataseed.binance.org"
    ws_url: "wss://bsc-ws-node.nariox.org:443"
    use_websocket: false
    explorer: "https://bscscan.com/tx/"
    confirmations: 1
    poll_interval_seconds: 6
    rules:
      - name: "BNB 巨鲸 > 1000"
        type: native_transfer
        threshold_eth: 1000      # 这里的 "eth" 单位对 BNB 同样适用（18 位小数）
      - name: "BUSD 大额 > 50万"
        type: erc20_transfer
        token: "0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56"
        token_symbol: "BUSD"
        decimals: 18
        threshold: 500000

