# chain-alert config example
# Copy to config.yaml and fill in your own values (config.yaml is gitignored).

chain:
  name: ethereum
  # Public RPC (example only - use your own node in production)
  rpc_url: "https://ethereum-rpc.publicnode.com"
  # 0 = start from the current head
  start_block: 0
  # wait N confirmations before processing
  confirmations: 1
  # poll interval in seconds
  poll_interval_seconds: 12

telegram:
  # create a bot via @BotFather
  bot_token: "123456:ABC-DEF..."
  # send your bot a message, then open
  # https://api.telegram.org/bot<TOKEN>/getUpdates to find your chat id
  chat_id: "123456789"

rules:
  # 1) large native ETH transfers
  - name: "ETH whale transfer"
    type: native_transfer
    threshold_eth: 1000

  # 2) large ERC20 transfers (USDT example)
  - name: "USDT large transfer"
    type: erc20_transfer
    token: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
    token_symbol: "USDT"
    decimals: 6
    threshold: 1000000

  # 3) watch a contract event (types only, no parameter names)
  - name: "Uniswap V2 Swap"
    type: contract_event
    address: "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
    event_signature: "Swap(address,uint256,uint256,uint256,uint256,address)"

  # 4) watch specific addresses
  - name: "Watched addresses"
    type: address_watch
    addresses:
      - "0x00000000219ab540356cBB839Cbe05303d7705Fa"